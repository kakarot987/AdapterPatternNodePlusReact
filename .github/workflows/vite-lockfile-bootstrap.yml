name: Regenerate Vite lockfile
on:
  push:
    branches: [chore/migrate-react-frontend-to-vite]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild lockfile from a clean dependency tree
        working-directory: frontend
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Push resolved lockfile
        run: |
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(frontend): resolve clean Vite npm dependency tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
